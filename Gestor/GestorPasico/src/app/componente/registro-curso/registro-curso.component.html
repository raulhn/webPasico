<button (click)="addCurso()">Añadir Curso</button>

<div>
  <app-appdatatable
    [$cabeceras]="cabecera_cursos"
    [$lista]="$cursos()"
    [$identificador]="$id_tabla_cursos()"
    (rowSelected)="click_curso($event)"
  ></app-appdatatable>

  @if (curso_seleccionado && curso_seleccionado.seleccionado == "N") {
    <div>
      <button (click)="activar_curso()">Activar Curso</button>
    </div>
  }
</div>
